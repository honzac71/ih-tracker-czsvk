<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Hockey Match Tracker - Step 1: Match Setup</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        h1, h2 { color: #38bdf8; margin-top: 0; }
        label { display: block; margin-top: 10px; font-size: 0.9rem; color: #94a3b8; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: white; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { background-color: #0f172a; color: #94a3b8; }
        .btn { background-color: #0284c7; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background-color: #0369a1; }
        .btn-danger { background-color: #ef4444; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-success { background-color: #10b981; width: 100%; padding: 15px; font-size: 1rem; margin-top: 20px; }
        .btn-success:hover { background-color: #059669; }
    </style>
</head>
<body>

<div class="container">
    <h1>Ice Hockey Match Setup</h1>

    <div class="card">
        <h2>1. Match Details</h2>
        <label>Tournament / League Name:</label>
        <input type="text" id="tournament" value="La Coupe des Montagnes 2026">

        <label>Opponent Team Name:</label>
        <input type="text" id="awayTeam" value="Queenstown Thunder">

        <label>Stage / Match Type:</label>
        <input type="text" id="stage" value="Group Stage">

        <label>Google Apps Script Web App URL:</label>
        <input type="text" id="scriptUrl" placeholder="Paste your deployed Google Apps Script URL here">
    </div>

    <div class="card">
        <h2>2. Team Roster & Hotkeys</h2>
        <p style="font-size: 0.85rem; color: #94a3b8;">Assign a keyboard hotkey (e.g., A, B, C...) to each player for instant tracking.</p>
        <table>
            <thead>
                <tr>
                    <th>Hotkey</th>
                    <th>Jersey #</th>
                    <th>First Name</th>
                    <th>Surname</th>
                    <th>Position (F/D/G)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="rosterTableBody"></tbody>
        </table>
        <button class="btn" onclick="addPlayerRow()">+ Add Player</button>
    </div>

    <button class="btn btn-success" onclick="saveAndProceed()">Save & Proceed to Line Setup ➔</button>
</div>

<script>
    let defaultRoster = [
        { id: "1", hotkey: "A", number: "55", firstName: "Richard", surname: "Tesarik", position: "F" },
        { id: "2", hotkey: "B", number: "71", firstName: "Jan", surname: "Cernoch", position: "F" },
        { id: "3", hotkey: "C", number: "3", firstName: "Ray", surname: "Khalil", position: "D" },
        { id: "4", hotkey: "D", number: "5", firstName: "Slavo", surname: "Boris", position: "D" },
        { id: "5", hotkey: "E", number: "39", firstName: "Jim", surname: "Zvonicek", position: "G" }
    ];

    function loadSavedSetup() {
        let saved = JSON.parse(localStorage.getItem('hockeyMatchSetup')) || {};
        if (saved.tournament) document.getElementById('tournament').value = saved.tournament;
        if (saved.awayTeam) document.getElementById('awayTeam').value = saved.awayTeam;
        if (saved.stage) document.getElementById('stage').value = saved.stage;
        if (saved.scriptUrl) document.getElementById('scriptUrl').value = saved.scriptUrl;

        let roster = saved.roster || defaultRoster;
        let tbody = document.getElementById('rosterTableBody');
        tbody.innerHTML = '';
        roster.forEach(p => appendPlayerRow(p));
    }

    function appendPlayerRow(p = {}) {
        let tbody = document.getElementById('rosterTableBody');
        let row = document.createElement('tr');
        row.innerHTML = `
            <td><input type="text" class="p-hotkey" value="${p.hotkey || ''}" style="width: 50px; text-align:center;" maxlength="1"></td>
            <td><input type="text" class="p-number" value="${p.number || ''}" style="width: 60px;"></td>
            <td><input type="text" class="p-firstname" value="${p.firstName || ''}"></td>
            <td><input type="text" class="p-surname" value="${p.surname || ''}"></td>
            <td>
                <select class="p-position">
                    <option value="F" ${p.position === 'F' ? 'selected' : ''}>Forward (F)</option>
                    <option value="D" ${p.position === 'D' ? 'selected' : ''}>Defense (D)</option>
                    <option value="G" ${p.position === 'G' ? 'selected' : ''}>Goalie (G)</option>
                </select>
            </td>
            <td><button class="btn btn-danger" onclick="this.closest('tr').remove()">X</button></td>
        `;
        tbody.appendChild(row);
    }

    function addPlayerRow() {
        appendPlayerRow();
    }

    function saveAndProceed() {
        let rows = document.querySelectorAll('#rosterTableBody tr');
        let roster = [];
        rows.forEach((r, idx) => {
            roster.push({
                id: String(idx + 1),
                hotkey: r.querySelector('.p-hotkey').value.toUpperCase().trim(),
                number: r.querySelector('.p-number').value.trim(),
                firstName: r.querySelector('.p-firstname').value.trim(),
                surname: r.querySelector('.p-surname').value.trim(),
                position: r.querySelector('.p-position').value
            });
        });

        let matchSetup = {
            tournament: document.getElementById('tournament').value.trim(),
            homeTeam: "Sydney Lions",
            awayTeam: document.getElementById('awayTeam').value.trim(),
            stage: document.getElementById('stage').value.trim(),
            scriptUrl: document.getElementById('scriptUrl').value.trim(),
            roster: roster
        };

        localStorage.setItem('hockeyMatchSetup', JSON.stringify(matchSetup));
        window.location.href = 'lines.html';
    }

    window.onload = loadSavedSetup;
</script>

</body>
</html>
