<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Hockey Match Tracker - Step 3: Live Game Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1250px; margin: 0 auto; }
        .grid-dashboard { display: grid; grid-template-columns: 2fr 1.2fr; gap: 20px; }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1, h2, h3 { color: #38bdf8; margin-top: 0; }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #334155;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .score-num { color: #10b981; font-size: 1.8rem; }
        .badge {
            background-color: #0284c7;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { background-color: #0f172a; color: #94a3b8; }
        
        /* Graphical Rink Layout */
        .rink-container {
            background: radial-gradient(circle, #1e3a8a 0%, #0f172a 80%);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
            position: relative;
        }
        .rink-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 10px 0;
        }
        .rink-player-card {
            background-color: rgba(15, 23, 42, 0.9);
            border: 1px solid #0284c7;
            border-radius: 6px;
            padding: 8px 12px;
            min-width: 100px;
            text-align: center;
        }
        .rink-pos { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
        .rink-num-hotkey { font-size: 1.1rem; color: #38bdf8; font-weight: bold; }
        .rink-hotkey-tag { background: #0369a1; color: #e0f2fe; padding: 1px 5px; border-radius: 3px; font-size: 0.75rem; margin-left: 4px; }
        .rink-name { font-size: 0.85rem; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }

        .event-log {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            height: 240px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .event-item { margin-bottom: 6px; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
        .hotkey-ref-box {
            font-size: 0.8rem;
            color: #94a3b8;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            line-height: 1.3;
        }
        .hotkey-ref-box span { color: #38bdf8; font-weight: bold; }
        .btn-danger { background-color: #ef4444; color: white; border: none; padding: 12px; font-size: 1rem; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-danger:hover { background-color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h1>Live Game Tracker</h1>

    <!-- Scoreboard Header -->
    <div class="card">
        <div class="scoreboard">
            <div><span id="displayHome">Home</span> <span class="score-num" id="homeScore">0</span></div>
            <div>
                <span id="displayPeriod" class="badge">PERIOD 1</span> 
                <span id="gameClock" style="margin-left: 15px; font-family: monospace; color: #38bdf8;">17:00</span>
                <span id="clockStatus" style="font-size: 0.75rem; margin-left: 5px; color: #ef4444;">[STOPPED]</span>
            </div>
            <div><span class="score-num" id="awayScore">0</span> <span id="displayAway">Away</span></div>
        </div>
    </div>

    <div class="grid-dashboard">
        <!-- Left Column: Graphical Rink & Feed -->
        <div>
            <div class="card">
                <h2>Currently On Ice (Graphical Rink)</h2>
                <div class="rink-container">
                    <div style="font-size: 0.8rem; color: #38bdf8; margin-bottom: 5px; font-weight: bold;">ATTACK ZONE ➔</div>
                    <div class="rink-row" id="rinkForwards"></div>
                    <div class="rink-row" id="rinkDefense"></div>
                    <div class="rink-row" id="rinkGoalieRow" style="margin-top: 8px;"></div>
                </div>

                <h3>Live Event Feed</h3>
                <div class="event-log" id="eventLog">
                    <div class="event-item">[17:00] Tracker initialized. Press Space Bar to start clock.</div>
                </div>
            </div>
        </div>

        <!-- Right Column: Controls Reference & Full Roster -->
        <div>
            <div class="card">
                <h2>Controls & Line Rosters</h2>
                <div class="hotkey-ref-box" id="controlsReferenceBox">
                    <!-- Populated dynamically -->
                </div>
                <button class="btn-danger" onclick="endGameAndSync()">End Match & Sync Stats to Google Sheets</button>
            </div>

            <div class="card">
                <h2>Active Roster</h2>
                <div>
                    <table>
                        <thead>
                            <tr><th>Key</th><th>#</th><th>Player</th><th>Stats (G/A/S/P)</th></tr>
                        </thead>
                        <tbody id="rosterHotkeyBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let matchSetup = JSON.parse(localStorage.getItem('hockeyMatchSetup')) || {};
    let roster = matchSetup.roster || [];
    let lines = matchSetup.lines || {};
    let lineShortcuts = matchSetup.lineShortcuts || {};

    let statsTracker = {};
    roster.forEach(p => {
        statsTracker[p.id] = { goals: 0, assists: 0, shots: 0, pim: 0 };
    });

    let activeForwardIds = [];
    let activeDefenseIds = [];
    let activeSpecialIds = [];
    let isSpecialTeamsMode = false;
    let scoreHome = 0;
    let scoreAway = 0;

    // Clock & Period variables
    let clockSeconds = 17 * 60; 
    let clockInterval = null;
    let isClockRunning = false;
    let currentPeriod = 1;

    // Manual goalie toggle tracking
    let manualGoalieOut = false;

    document.getElementById('displayHome').innerText = matchSetup.homeTeam || 'Home';
    document.getElementById('displayAway').innerText = matchSetup.awayTeam || 'Away';

    function initTracker() {
        renderControlsReference();
        renderRosterTable();
        updateGraphicalRink();
        updateClockDisplay();
    }

    function getGoaliePlayer() {
        return roster.find(p => String(p.position || '').toUpperCase().includes('G'));
    }

    function toggleClock() {
        if (isClockRunning) {
            clearInterval(clockInterval);
            isClockRunning = false;
            document.getElementById('clockStatus').innerText = "[STOPPED]";
            document.getElementById('clockStatus').style.color = "#ef4444";
            logEvent("Clock stopped");
        } else {
            isClockRunning = true;
            document.getElementById('clockStatus').innerText = "[RUNNING]";
            document.getElementById('clockStatus').style.color = "#10b981";
            logEvent("Clock started");
            
            clockInterval = setInterval(() => {
                if (clockSeconds > 0) {
                    clockSeconds--;
                    updateClockDisplay();
                } else {
                    clearInterval(clockInterval);
                    isClockRunning = false;
                    document.getElementById('clockStatus').innerText = "[PERIOD END]";
                    handlePeriodEnd();
                }
            }, 1000);
        }
    }

    function handlePeriodEnd() {
        logEvent(`Period ${currentPeriod} ended.`);

        if (currentPeriod === 1) {
            currentPeriod = 2;
            clockSeconds = 17 * 60;
            document.getElementById('displayPeriod').innerText = "PERIOD 2";
            document.getElementById('clockStatus').innerText = "[READY - SPACEBAR]";
            logEvent("Period 2 ready. Press Space Bar to start.");
            manualGoalieOut = false; // Reset goalie lock for new period
            updateGraphicalRink();
            updateClockDisplay();
        } else if (currentPeriod === 2) {
            currentPeriod = 3;
            clockSeconds = 17 * 60;
            document.getElementById('displayPeriod').innerText = "PERIOD 3";
            document.getElementById('clockStatus').innerText = "[READY - SPACEBAR]";
            logEvent("Period 3 ready. Press Space Bar to start.");
            manualGoalieOut = false;
            updateGraphicalRink();
            updateClockDisplay();
        } else if (currentPeriod === 3) {
            if (scoreHome === scoreAway) {
                let goOT = confirm("Score is tied after 3 periods! Do you want to go to Overtime (OT)?");
                if (goOT) {
                    currentPeriod = 'OT';
                    clockSeconds = 5 * 60; // 5 min OT
                    document.getElementById('displayPeriod').innerText = "OVERTIME";
                    document.getElementById('clockStatus').innerText = "[READY - SPACEBAR]";
                    logEvent("Overtime ready. Press Space Bar to start.");
                    manualGoalieOut = false;
                    updateGraphicalRink();
                    updateClockDisplay();
                    return;
                }
            }
            document.getElementById('clockStatus').innerText = "[MATCH FINAL]";
            logEvent("Match ended.");
        } else if (currentPeriod === 'OT') {
            document.getElementById('clockStatus').innerText = "[MATCH FINAL]";
            logEvent("Overtime ended. Match final.");
        }
    }

    function updateClockDisplay() {
        let mins = Math.floor(clockSeconds / 60);
        let secs = clockSeconds % 60;
        let timeStr = `${mins}:${secs < 10 ?
