<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Hockey Match Tracker - Step 3: Live Game Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1250px; margin: 0 auto; }
        .grid-dashboard { display: grid; grid-template-columns: 2fr 1.2fr; gap: 20px; }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1, h2, h3 { color: #38bdf8; margin-top: 0; }
        
        .scoreboard, .switch-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #334155;
            box-sizing: border-box;
            width: 100%;
        }
        .switch-board {
            margin-top: 15px;
            padding: 12px 20px;
            gap: 10px;
        }
        
        .team-box { text-align: center; }
        .score-num { color: #10b981; font-size: 1.8rem; display: block; }
        .away-score-num { color: #ef4444; font-size: 1.8rem; display: block; }
        .shot-subtext { font-size: 0.8rem; color: #94a3b8; font-weight: normal; margin-top: 2px; }
        .badge {
            background-color: #0284c7;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .btn-switch {
            padding: 10px 16px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            color: white;
            flex: 1;
            transition: background-color 0.2s;
        }
        .btn-switch-goal { background-color: #dc2626; }
        .btn-switch-goal:hover { background-color: #b91c1c; }
        .btn-switch-penalty { background-color: #059669; }
        .btn-switch-penalty:hover { background-color: #047857; }
        .btn-switch-rewind { background-color: #0284c7; }
        .btn-switch-rewind:hover { background-color: #0369a1; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { background-color: #0f172a; color: #94a3b8; }
        
        .rink-container {
            background: radial-gradient(circle, #1e3a8a 0%, #0f172a 80%);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
            position: relative;
        }
        .rink-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 10px 0;
        }
        .rink-player-card {
            background-color: rgba(15, 23, 42, 0.9);
            border: 1px solid #0284c7;
            border-radius: 6px;
            padding: 8px 12px;
            min-width: 100px;
            text-align: center;
        }
        .rink-pos { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
        .rink-num-hotkey { font-size: 1.1rem; color: #38bdf8; font-weight: bold; }
        .rink-hotkey-tag { background: #0369a1; color: #e0f2fe; padding: 1px 5px; border-radius: 3px; font-size: 0.75rem; margin-left: 4px; }
        .rink-name { font-size: 0.85rem; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
        
        .penalty-box-container {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
            display: none;
        }
        .penalty-box-item-red {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #fca5a5;
        }
        .penalty-box-item-green {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #6ee7b7;
        }
        .penalty-countdown { font-family: monospace; font-weight: bold; font-size: 1.1rem; }

        .goalie-status-bar {
            margin-top: 10px;
            padding: 5px 10px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #10b981;
            display: inline-block;
        }
        .goalie-status-out { color: #ef4444; }
        .game-situation-container {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
        }
        .game-situation-badge {
            background: #f59e0b;
            color: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .penalty-timer {
            font-family: monospace;
            font-size: 0.85rem;
            color: #ef4444;
            font-weight: bold;
            background: rgba(239, 68, 68, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .event-log {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .event-item { margin-bottom: 6px; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
        .hotkey-ref-box {
            font-size: 0.8rem
