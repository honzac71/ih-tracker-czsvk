<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Hockey Match Tracker - Step 2: Line Setup</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        h1, h2 { color: #38bdf8; margin-top: 0; }
        .line-group { margin-bottom: 20px; padding: 15px; background: #0f172a; border-radius: 6px; border: 1px solid #334155; }
        select { background: #1e293b; color: white; padding: 6px; border-radius: 4px; border: 1px solid #334155; margin-right: 10px; }
        select.error-highlight { border: 2px solid #ef4444; }
        .btn { background-color: #0284c7; color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background-color: #0369a1; }
        .error-msg { color: #ef4444; font-size: 0.85rem; font-weight: bold; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Match Lineups & Special Teams Setup</h1>

    <div class="card">
        <h2>Configure All Lines & Special Teams (Required)</h2>
        <p style="color: #94a3b8; font-size: 0.9rem;">Every player slot across all lines, special teams, and 4v4 must be selected before proceeding.</p>
        <div id="linesContainer"></div>
        <button class="btn" onclick="saveLinesAndProceed()">Save Lineup & Go to Live Game</button>
    </div>
</div>

<script>
    let matchSetup = JSON.parse(localStorage.getItem('hockeyMatchSetup')) || {};
    let roster = matchSetup.roster || JSON.parse(localStorage.getItem('hockeyMasterRoster')) || [];

    let lineConfigs = [
        { key: 'f1', name: 'Forward Line 1 (F1)', type: 'F', count: 3 },
        { key: 'f2', name: 'Forward Line 2 (F2)', type: 'F', count: 3 },
        { key: 'f3', name: 'Forward Line 3 (F3)', type: 'F', count: 3 },
        { key: 'd1', name: 'Defense Pair 1 (F4)', type: 'D', count: 2 },
        { key: 'd2', name: 'Defense Pair 2 (F5)', type: 'D', count: 2 },
        { key: '4v4', name: '4v4 Formation (F11)', type: '4v4', count: 4 },
        { key: 'PP1', name: 'Power Play 1 (F6)', type: 'PP', count: 5 },
        { key: 'PP2', name: 'Power Play 2 (F7)', type: 'PP', count: 5 },
        { key: 'PK1', name: 'Penalty Kill 1 (F8)', type: 'PK', count: 4 },
        { key: 'PK2', name: 'Penalty Kill 2 (F9)', type: 'PK', count: 4 },
        { key: 'PK3', name: 'Penalty Kill 3 (F10)', type: 'PK', count: 4 }
    ];

    function renderLineSetup() {
        let container = document.getElementById('linesContainer');
        container.innerHTML = '';

        lineConfigs.forEach(cfg => {
            let html = `<div class="line-group" id="group_${cfg.key}">
                <h3>${cfg.name}</h3>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">`;
            
            if (cfg.type === 'F' || cfg.type === 'D') {
                for (let i = 1; i <= cfg.count; i++) {
                    html += buildSelect(`${cfg.key}_${i}`, `${cfg.type.toUpperCase()} ${i}`);
                }
            } else if (cfg.type === '4v4') {
                html += buildSelect(`${cfg.key}_f1`, 'FWD 1');
                html += buildSelect(`${cfg.key}_f2`, 'FWD 2');
                html += buildSelect(`${cfg.key}_d1`, 'DEF 1');
                html += buildSelect(`${cfg.key}_d2`, 'DEF 2');
            } else {
                let fCount = (cfg.type === 'PP') ? 3 : 2;
                let dCount = (cfg.type === 'PP') ? 2 : 2;
                for (let i = 1; i <= fCount; i++) {
                    html += buildSelect(`${cfg.key}_f${i}`, `FWD ${i}`);
                }
                for (let i = 1; i <= dCount; i++) {
                    html += buildSelect(`${cfg.key}_d${i}`, `DEF ${i}`);
                }
            }

            html += `</div><div class="error-msg" id="err_${cfg.key}">Please fill out all player slots for this line.</div></div>`;
            container.innerHTML += html;
        });

        if (matchSetup.lines) {
            Object.keys(matchSetup.lines).forEach(slotKey => {
                let el = document.getElementById(slotKey);
                if (el) el.value = matchSetup.lines[slotKey];
            });
        }
    }

    function buildSelect(slotId, label) {
        let options = `<option value="">-- Select ${label} --</option>`;
        roster.forEach(p => {
            let num = String(p.number || '').replace('#', '').trim();
            options += `<option value="${p.id}">#${num} ${p.surname} (${p.position})</option>`;
        });
        return `<div><label style="font-size:0.8rem; color:#94a3b8; display:block;">${label}</label><select id="${slotId}" class="line-select">${options}</select></div>`;
    }

    function saveLinesAndProceed() {
        let linesData = {};
        let isValid = true;

        lineConfigs.forEach(cfg => {
            let groupValid = true;
            let currentGroupSlots = [];

            if (cfg.type === 'F' || cfg.type === 'D') {
                for (let i = 1; i <= cfg.count; i++) {
                    currentGroupSlots.push(`${cfg.key}_${i}`);
                }
            } else if (cfg.type === '4v4') {
                currentGroupSlots = [`${cfg.key}_f1`, `${cfg.key}_f2`, `${cfg.key}_d1`, `${cfg.key}_d2`];
            } else {
                let fCount = (cfg.type === 'PP') ? 3 : 2;
                let dCount = (cfg.type === 'PP') ? 2 : 2;
                for (let i = 1; i <= fCount; i++) currentGroupSlots.push(`${cfg.key}_f${i}`);
                for (let i = 1; i <= dCount; i++) currentGroupSlots.push(`${cfg.key}_d${i}`);
            }

            currentGroupSlots.forEach(slotId => {
                let el = document.getElementById(slotId);
                let val = el ? el.value : '';
                if (!val) {
                    groupValid = false;
                    isValid = false;
                    if (el) el.classList.add('error-highlight');
                } else {
                    if (el) el.classList.remove('error-highlight');
                    linesData[slotId] = val;
                }
            });

            let errEl = document.getElementById(`err_${cfg.key}`);
            if (errEl) {
                errEl.style.display = groupValid ? 'none' : 'block';
            }
        });

        if (!isValid) {
            alert('Incomplete Lineup! You must assign a player to every single slot across all lines, special teams, and 4v4 before proceeding to the game.');
            return;
        }

        matchSetup.lines = linesData;
        matchSetup.lineShortcuts = {
            'f1': 'F1', 'f2': 'F2', 'f3': 'F3',
            'd1': 'F4', 'd2': 'F5',
            '4v4': 'F11',
            'PP1': 'F6', 'PP2': 'F7',
            'PK1': 'F8', 'PK2': 'F9', 'PK3': 'F10'
        };

        localStorage.setItem('hockeyMatchSetup', JSON.stringify(matchSetup));
        window.location.href = 'game.html';
    }

    window.onload = renderLineSetup;
</script>

</body>
</html>
