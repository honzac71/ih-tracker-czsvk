<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Hockey Match Tracker - Step 2: Line Setup</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        h1, h2 { color: #38bdf8; margin-top: 0; }
        .grid-lines { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .line-box { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 12px; }
        label { display: block; margin-top: 8px; font-size: 0.85rem; color: #94a3b8; }
        select, input { width: 100%; padding: 8px; margin-top: 4px; background: #1e293b; border: 1px solid #334155; border-radius: 4px; color: white; box-sizing: border-box; }
        .btn { background-color: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; font-size: 1rem; }
        .btn:hover { background-color: #0369a1; }
    </style>
</head>
<body>

<div class="container">
    <h1>Line Combinations & Shortcuts</h1>

    <div class="card">
        <h2>Keyboard Shortcuts for Lines</h2>
        <div class="grid-lines" id="shortcutsConfigContainer"></div>
    </div>

    <div class="card">
        <h2>Line Rosters</h2>
        <div class="grid-lines" id="linesConfigContainer"></div>
    </div>

    <button class="btn" onclick="saveLinesAndProceed()">Save & Open Live Game Tracker ➔</button>
</div>

<script>
    let matchSetup = JSON.parse(localStorage.getItem('hockeyMatchSetup')) || { roster: [] };
    let roster = matchSetup.roster;

    let lineConfigs = [
        { key: 'f1', name: 'Forward Line 1', slots: ['LW', 'C', 'RW'] },
        { key: 'f2', name: 'Forward Line 2', slots: ['LW', 'C', 'RW'] },
        { key: 'f3', name: 'Forward Line 3', slots: ['LW', 'C', 'RW'] },
        { key: 'd1', name: 'Defense Pair 1', slots: ['LD', 'RD'] },
        { key: 'd2', name: 'Defense Pair 2', slots: ['LD', 'RD'] },
        { key: '4v4', name: '4v4 Combo', slots: ['LW', 'RW', 'LD', 'RD'] },
        { key: 'PP1', name: 'Power Play 1', slots: ['LW', 'C', 'RW', 'LD', 'RD'] },
        { key: 'PP2', name: 'Power Play 2', slots: ['LW', 'C', 'RW', 'LD', 'RD'] },
        { key: 'PK1', name: 'Penalty Kill 1', slots: ['F1', 'F2', 'D1', 'D2'] },
        { key: 'PK2', name: 'Penalty Kill 2', slots: ['F1', 'F2', 'D1', 'D2'] },
        { key: 'PK3', name: 'Penalty Kill 3', slots: ['F1', 'F2', 'D1', 'D2'] }
    ];

    let defaultShortcuts = {
        'f1': 'F1', 'f2': 'F2', 'f3': 'F3',
        'd1': 'F4', 'd2': 'F5',
        '4v4': 'F11',
        'PP1': 'F6', 'PP2': 'F7',
        'PK1': 'F8', 'PK2': 'F9', 'PK3': 'F10'
    };

    function renderSetup() {
        let savedShortcuts = matchSetup.lineShortcuts || defaultShortcuts;
        let scContainer = document.getElementById('shortcutsConfigContainer');
        scContainer.innerHTML = '';
        
        lineConfigs.forEach(lc => {
            let val = savedShortcuts[lc.key] || '';
            scContainer.innerHTML += `
                <div>
                    <label>${lc.name} Shortcut Key:</label>
                    <input type="text" id="sc_${lc.key}" value="${val}" style="text-transform:uppercase;">
                </div>
            `;
        });

        let savedLines = matchSetup.lines || {};
        let lContainer = document.getElementById('linesConfigContainer');
        lContainer.innerHTML = '';

        lineConfigs.forEach(lc => {
            let slotsHtml = '';
            lc.slots.forEach(slot => {
                let slotKey = `${lc.key}_${slot}`.toLowerCase();
                let selectedId = savedLines[slotKey] || '';
                
                let options = `<option value="">-- Select Player --</option>`;
                roster.forEach(p => {
                    options += `<option value="${p.id}" ${selectedId == p.id ? 'selected' : ''}>#${p.number} ${p.surname} (${p.position})</option>`;
                });

                slotsHtml += `
                    <label>${slot}:</label>
                    <select id="line_${slotKey}">${options}</select>
                `;
            });

            lContainer.innerHTML += `
                <div class="line-box">
                    <h3>${lc.name}</h3>
                    ${slotsHtml}
                </div>
            `;
        });
    }

    function saveLinesAndProceed() {
        let shortcuts = {};
        lineConfigs.forEach(lc => {
            shortcuts[lc.key] = document.getElementById(`sc_${lc.key}`).value.toUpperCase().trim();
        });

        let lines = {};
        lineConfigs.forEach(lc => {
            lc.slots.forEach(slot => {
                let slotKey = `${lc.key}_${slot}`.toLowerCase();
                lines[slotKey] = document.getElementById(`line_${slotKey}`).value;
            });
        });

        matchSetup.lineShortcuts = shortcuts;
        matchSetup.lines = lines;

        localStorage.setItem('hockeyMatchSetup', JSON.stringify(matchSetup));
        window.location.href = 'game.html';
    }

    window.onload = renderSetup;
</script>

</body>
</html>
